  .zig{height:11px;width:100%;background-image:linear-gradient(135deg, var(--ink) 25%, transparent 25.5%),linear-gradient(225deg, var(--ink) 25%, transparent 25.5%);background-size:14px 14px;}
  .zig.rev{background-image:linear-gradient(-45deg, var(--paper) 25%, transparent 25.5%),linear-gradient(45deg, var(--paper) 25%, transparent 25.5%);background-size:14px 14px;background-color:var(--ink);}

  header{background:var(--ink);color:var(--paper);padding:calc(18px + env(safe-area-inset-top)) 18px 20px 18px;position:relative;overflow:hidden;}

  .wordmark{font-size:clamp(32px, 11vw, 52px);line-height:.85;color:var(--paper);margin:0;letter-spacing:.5px;}

  .concepts{font-family:'JetBrains Mono';font-size:10px;letter-spacing:2.5px;color:var(--ember);text-transform:uppercase;margin:8px 0 0 0;}
  .story{font-size:12.5px;line-height:1.55;color:var(--paper);opacity:.82;margin:12px 0 2px 0;max-width:44ch;}
  .subtag{font-family:'Permanent Marker';font-size:12.5px;color:var(--ember);margin:8px 0 0 0;opacity:.9;}

  .stamp{flex:0 0 auto;width:66px;height:66px;border-radius:50%;border:3px double var(--flame);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);}

  .tab{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:12.5px;letter-spacing:.3px;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:10px 15px;min-height:44px;cursor:pointer;flex:0 0 auto;}
  .tab.active{background:var(--flame);border-color:var(--flame);color:#fff;}

  main{max-width:640px;margin:0 auto;padding:20px 16px 10px 16px;}

  .section{display:none;}
  .section.active{display:block;animation:fade .25s ease;}

  .flyer{background:var(--paper2);border-radius:14px;padding:18px 16px 8px 16px;position:relative;box-shadow:0 10px 24px -14px rgba(0,0,0,.5);border:1px solid var(--line);}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 4px 0;}
  .section-head h2{font-size:24px;margin:0;color:var(--ink);}
  .section-note{font-size:11.5px;color:var(--gray);margin:0 0 14px 0;line-height:1.5;}

  .subgroup-label{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:12.5px;color:var(--flame);letter-spacing:.5px;margin:20px 0 8px 0;padding-bottom:4px;border-bottom:2px solid var(--ember);clear:both;}

  .item{padding:12px 0;border-bottom:1px dashed var(--line);overflow:hidden;}

  .item-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .item-name{font-size:15px;font-weight:600;color:var(--ink);flex:1 1 auto;overflow-wrap:break-word;}
  .item-price{color:var(--flame);font-size:15.5px;flex:0 0 auto;white-space:nowrap;font-weight:700;}
  .item-desc{font-size:12.5px;color:var(--gray);margin-top:3px;line-height:1.45;overflow-wrap:break-word;}
  .funfact{font-family:'Permanent Marker';font-size:12px;color:var(--flame-dk);margin-top:6px;opacity:.85;line-height:1.3;}

  .variant-chip .vp{font-family:'Anton';color:var(--ember);font-size:16px;}

  .size-chip .sz{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.75;}
  .size-chip .pr{font-family:'Anton';color:var(--ember);font-size:17px;}

  .flavor-top{display:flex;align-items:baseline;gap:8px;}

  .foot-fine{font-size:10.5px;color:#9a9284;margin-top:16px;line-height:1.5;}
  .halal-note{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono';font-size:10.5px;color:var(--ember);letter-spacing:.5px;margin-top:14px;}

</head>

/* ---------- rendering ---------- */
function photoBox(num){
  if(!num) return "";
  return `<div class="polaroid"><img src="${num}.jpg" data-num="${num}" data-i="0" alt="" onerror="polaroidFallback(this)"><span class="cap">Nº${num}</span></div>`;
}
function polaroidFallback(img){
  const exts=["jpg","jpeg","png","webp"];
  let i = parseInt(img.dataset.i||"0",10)+1;
  if(i<exts.length){ img.dataset.i=i; img.src = img.dataset.num + "." + exts[i]; return; }
  const box = img.closest(".polaroid");
  box.classList.add("ph-empty");
  box.innerHTML = `<div class="ph-inner">🔥<span>Nº${img.dataset.num}</span></div>`;
}

function renderVariants(variants){
  return `<div class="variant-row">${variants.map(v=>
    `<div class="variant-chip"><div class="vk">${t(VARIANT_LABELS[v.key])}</div><div class="vp mono">${eur(v.price)}</div></div>`
  ).join("")}</div>`;
}

function renderItem(it){
  const badge = it.tag==="nuevo" ? `<span class="badge-new">${t({es:"¡Nuevo!",ca:"Nou!",en:"New!"})}</span>` : "";
  return `<div class="item">
    ${photoBox(it.photo)}
    <div class="item-top">
      <span class="item-name">${t(it.name)}${badge}</span>
      ${it.price!==undefined ? `<span class="item-price mono">${eur(it.price)}</span>` : ""}
    </div>
    ${it.desc ? `<div class="item-desc">${t(it.desc)}</div>` : ""}
    ${it.variants ? renderVariants(it.variants) : ""}
  </div>`;
}

function renderItemsSection(cat){
  let html = "";
  let lastGroup = null;
  cat.items.forEach(it=>{
    if(it.group && it.group !== lastGroup){
      html += `<div class="subgroup-label">${it.group}</div>`;
      lastGroup = it.group;
    }
    html += renderItem(it);
  });
  return html;
}

function renderPizzaSection(cat){
  const sizeChips = Object.entries(cat.sizes).map(([sz,pr])=>
    `<div class="size-chip"><div class="sz">${t(VARIANT_LABELS[sz])}</div><div class="pr mono">${eur(pr)}</div></div>`
  ).join("");
  const flavors = cat.flavors.map(f=>`
    <div class="flavor">
      ${photoBox(f.photo)}
      <div class="flavor-top"><span class="fnum mono">${f.num}</span><span class="flavor-name">${t(f.name)}</span></div>
      <div class="flavor-ing">${t(f.ing)}</div>
      ${f.funfact ? `<div class="funfact">${t(f.funfact)}</div>` : ""}
    </div>`).join("");
  return `<div class="size-row">${sizeChips}</div>${flavors}`;
}

function buildMenu(keepActive){
  const tabsEl = document.getElementById("tabs");
  const mainEl = document.getElementById("main");
  tabsEl.innerHTML = "";
  mainEl.innerHTML = "";

  CATEGORIES.forEach((cat, i)=>{
    const isActive = keepActive ? cat.id === keepActive : i === 0;

    const btn = document.createElement("button");
    btn.className = "tab" + (isActive ? " active" : "");
    btn.textContent = (cat.icon ? cat.icon + " " : "") + t(cat.label);
    btn.dataset.target = cat.id;
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
      document.querySelectorAll(".section").forEach(el=>el.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("sec-"+cat.id).classList.add("active");
    });
    tabsEl.appendChild(btn);

    const sec = document.createElement("section");
    sec.className = "section" + (isActive ? " active" : "");
    sec.id = "sec-" + cat.id;
    sec.innerHTML = `
      <div class="flyer">
        <div class="section-head"><h2 class="display">${t(cat.label)}</h2></div>
        ${cat.note ? `<div class="section-note">${t(cat.note)}</div>` : ""}
        ${cat.type === "pizza" ? renderPizzaSection(cat) : renderItemsSection(cat)}
      </div>`;
    mainEl.appendChild(sec);
  });
}

function translateStatic(){
  document.querySelectorAll("[data-t]").forEach(el=>{
    const key = el.getAttribute("data-t");
    if(STRINGS[key]) el.textContent = t(STRINGS[key]);
  });
  document.documentElement.lang = LANG;
}

function setLang(lang){
  LANG = lang;
  document.querySelectorAll(".langbtn").forEach(b=>b.classList.toggle("active", b.dataset.lang===lang));
  const current = document.querySelector(".tab.active");
  const keepId = current ? current.dataset.target : null;
  translateStatic();
  buildMenu(keepId);
}

document.querySelectorAll(".langbtn").forEach(btn=>{
  btn.addEventListener("click", ()=> setLang(btn.dataset.lang));
});

document.getElementById("mapLink").href =
  "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(FIXED.address);

translateStatic();
buildMenu(null);
</script>
